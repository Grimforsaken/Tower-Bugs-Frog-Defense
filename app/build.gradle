plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grimforsaken.towerbugs'
    compileSdk 36

    defaultConfig {
        applicationId 'com.grimforsaken.towerbugs.frogdefense.compat'
        minSdk 23
        targetSdk 33
        versionCode 3
        versionName '0.1.2'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
