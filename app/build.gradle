plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grimforsaken.towerbugs'
    compileSdk 36

    defaultConfig {
        applicationId 'com.grimforsaken.towerbugs.frogdefense.v021'
        minSdk 23
        targetSdk 33
        versionCode 5
        versionName '0.2.1'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
