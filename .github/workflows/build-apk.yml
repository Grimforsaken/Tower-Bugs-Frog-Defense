name: Build Compatibility APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Create temporary development signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/towerbugs-compat.jks" \
            -storepass towerbugs123 \
            -keypass towerbugs123 \
            -alias towerbugs \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Tower Bugs Development,O=Grimforsaken,C=US"

      - name: Sign compatibility APK with V1 and V2
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/towerbugs-compat.jks" \
            --ks-key-alias towerbugs \
            --ks-pass pass:towerbugs123 \
            --key-pass pass:towerbugs123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out app/build/outputs/apk/release/Tower-Bugs-Frog-Defense-v0.1.2-compat.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify V1 and V2 signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/Tower-Bugs-Frog-Defense-v0.1.2-compat.apk)"
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -F "Verified using v1 scheme (JAR signing): true"
          echo "$VERIFY_OUTPUT" | grep -F "Verified using v2 scheme (APK Signature Scheme v2): true"

      - name: Inspect APK package compatibility
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging app/build/outputs/apk/release/Tower-Bugs-Frog-Defense-v0.1.2-compat.apk)"
          echo "$BADGING" | head -n 10
          echo "$BADGING" | grep -F "package: name='com.grimforsaken.towerbugs.frogdefense.compat'"
          echo "$BADGING" | grep -F "sdkVersion:'23'"
          echo "$BADGING" | grep -F "targetSdkVersion:'33'"

      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: tower-bugs-frog-defense-v0.1.2-compat
          path: app/build/outputs/apk/release/Tower-Bugs-Frog-Defense-v0.1.2-compat.apk
          if-no-files-found: error
