name: Build Tower Bugs APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble game source and reconstruct verified assets
        run: |
          cat buildsrc/GameView.java.part00 buildsrc/GameView.java.part01 buildsrc/GameView.java.part02 buildsrc/GameView.java.part03 buildsrc/GameView.java.part04 buildsrc/GameView.java.part05 > app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/grimforsaken/towerbugs/GameView.java')
          s = p.read_text()
          pattern = re.compile(r'''        if \(actionButton\.contains\(x, y\)\) \{\n\s*if \(phase == Phase\.BUILD \|\| phase == Phase\.INTERMISSION\) startNextWave\(\);\n\s*return true;\n\s*\}''')
          new = '''        if (actionButton.contains(x, y)) {
              if (phase == Phase.BUILD) {
                  startNextWave();
              } else if (phase == Phase.INTERMISSION) {
                  int skipReward = Math.max(0, (int)Math.ceil(intermission));
                  coins += skipReward;
                  intermission = 0f;
                  startNextWave();
              }
              return true;
          }'''
          s2, count = pattern.subn(new, s, count=1)
          if count != 1:
              raise SystemExit(f'Skip-wave source block match count: {count}')
          p.write_text(s2)
          PY

          python3 buildsrc/patch_v022.py
          python3 buildsrc/patch_v023.py
          python3 buildsrc/patch_v024.py
          python3 buildsrc/patch_v025.py

          grep -F 'LOWEST_HP_PERCENT' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'ELEMENTAL_WEAKNESS' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'skipReward' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'private boolean paused;' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'awardFirstClearWaveBugBuck' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'if (frog.boss) return false;' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'if (!frog.boss)' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'return 3 + type.ordinal();' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'freeBlocks = 18 + freeBlockUpgrade * 2;' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'campaignWave / 10' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'spawnRemaining = 5 + level + wave;' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'if (level < 5 || frog.path == null) return 1f;' app/src/main/java/com/grimforsaken/towerbugs/GameView.java
          grep -F 'level <= 2 ? 0.78f' app/src/main/java/com/grimforsaken/towerbugs/GameView.java

          mkdir -p app/src/main/assets
          cat \
            buildsrc/game_assets_40.b64.part00 \
            buildsrc/game_assets_40.b64.part01 \
            buildsrc/game_assets_40.b64.part02 \
            buildsrc/game_assets_40.b64.part03 \
            buildsrc/game_assets_40.b64.part04 \
            buildsrc/game_assets_40.b64.part05 \
            buildsrc/game_assets_40.b64.part06 \
            buildsrc/game_assets_40.b64.part07 \
            buildsrc/game_assets_40.b64.part08 \
            buildsrc/final_assets40.part03.b64 \
            | base64 -d > app/src/main/assets/game_assets.zip

          echo '5b5c73aadbbc8d8a4973ecaf31334c3f6dab50e865b2abfa8c9df4deaff6c340  app/src/main/assets/game_assets.zip' | sha256sum -c -
          unzip -t app/src/main/assets/game_assets.zip
          test "$(unzip -Z1 app/src/main/assets/game_assets.zip | wc -l)" -eq 35

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Decode stable development signing key
        run: |
          base64 -d buildsrc/towerbugs-dev.jks.b64 > "$RUNNER_TEMP/towerbugs-dev.jks"
          echo '6690d12232290f9d446704bc55f357f45028db9e17485a56a16db3f825d4802b  '"$RUNNER_TEMP/towerbugs-dev.jks" | sha256sum -c -

      - name: Sign APK with V1 and V2
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/towerbugs-dev.jks" \
            --ks-key-alias towerbugs \
            --ks-pass pass:towerbugs123 \
            --key-pass pass:towerbugs123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out app/build/outputs/apk/release/Tower-Bugs-Frog-Defense-v0.2.5.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify signatures package and archive
        run: |
          APK='app/build/outputs/apk/release/Tower-Bugs-Frog-Defense-v0.2.5.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -F "Verified using v1 scheme (JAR signing): true"
          echo "$VERIFY_OUTPUT" | grep -F "Verified using v2 scheme (APK Signature Scheme v2): true"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | head -n 12
          echo "$BADGING" | grep -F "package: name='com.grimforsaken.towerbugs.frogdefense' versionCode='9' versionName='0.2.5'"
          echo "$BADGING" | grep -F "sdkVersion:'23'"
          echo "$BADGING" | grep -F "targetSdkVersion:'33'"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tower-bugs-frog-defense-v0.2.5
          path: app/build/outputs/apk/release/Tower-Bugs-Frog-Defense-v0.2.5.apk
          if-no-files-found: error
